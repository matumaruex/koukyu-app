<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#276652"><meta name="description" content="希望休と勤務条件を守って作る、見やすい公休表。"><title>公休表</title><link rel="stylesheet" href="/mobile.css?v=6"><script src="/mobile.js?v=6" defer></script></head>
<body><header class="top"><div><small>毎月のシフトづくりを、かんたんに。</small><h1>公休表</h1></div><button id="settings" class="plain">設定</button></header>
<main id="main"><div id="notice" role="status" aria-live="polite" hidden></div><div class="period"><button id="previous" aria-label="前の期間">〈</button><label><span>対象期間</span><input type="month" id="month" aria-label="対象の開始月"></label><button id="next" aria-label="次の期間">〉</button></div><p id="period-label" class="period-label"></p>
<section id="view" aria-live="polite"></section></main>
<div id="toast" role="status" aria-live="polite" hidden></div><nav class="bottom" aria-label="画面の切り替え"><button data-tab="schedule" aria-current="page"><span aria-hidden="true">▦</span>公休表</button><button data-tab="requests"><span aria-hidden="true">○</span>希望休</button><button data-tab="staff"><span aria-hidden="true">♧</span>職員</button></nav>
<dialog id="dialog"><div id="dialog-body"></div></dialog><input type="file" id="import" accept=".json" hidden>
<footer>公休表 3.0</footer></body></html>
